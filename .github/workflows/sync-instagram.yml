# Keeps the portfolio in step with @akshthetics.jpg on Instagram.
# Runs every 3 hours (at :17, off GitHub's busy top-of-the-hour slots, since
# GitHub sometimes delays or skips scheduled runs). New posts, likes and
# deletions are committed straight to main; Vercel redeploys from main.
name: Sync Instagram

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      refresh_all:
        description: "Re-read every post (likes, captions, images)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Pull posts from Instagram
        id: sync
        run: node scripts/sync-instagram.mjs ${{ inputs.refresh_all && '--refresh-all' || '' }}

      - name: Commit changes
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram.json assets/img/ig
          if git diff --cached --quiet; then exit 0; fi
          added="${{ steps.sync.outputs.added }}"
          removed="${{ steps.sync.outputs.removed }}"
          if [ "$added" != "0" ] || [ "$removed" != "0" ]; then
            msg="Instagram: ${added} new, ${removed} removed"
          else
            msg="Instagram: refresh likes and counts"
          fi
          git commit -m "$msg"
          git push
